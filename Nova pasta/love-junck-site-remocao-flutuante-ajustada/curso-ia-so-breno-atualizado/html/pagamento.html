<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pagamento | Cardápio Digital</title>

    <link rel="stylesheet" href="../css/pagamento.css">
    <link rel="stylesheet" href="../css/dark-mode.css">

    <!-- Ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

    <main>
        <div class="checkout-container">

            <!-- ETAPA 2: FORMA DE PAGAMENTO -->
            <section id="step-2-content" class="payment-card">

                <div class="payment-header">
                    <h2>
                        <i class="fa-solid fa-credit-card"></i>
                        Forma de Pagamento
                    </h2>

                    <button type="button" class="back-button" onclick="backToAddress()">
                        <i class="fa-solid fa-arrow-left"></i>
                        Voltar
                    </button>
                </div>

                <p>Escolha como deseja pagar seu pedido.</p>

                <div class="payment-options">

                    <!-- PIX -->
                    <label class="payment-option">
                        <input type="radio" name="payment-method" value="pix" onchange="togglePaymentFields('pix')">

                        <span>
                            <i class="fa-brands fa-pix pix-icon"></i>

                            <span>
                                <strong>PIX</strong>
                                <small>Pagamento instantâneo</small>
                            </span>
                        </span>
                    </label>

                    <!-- CARTÃO -->
                    <label class="payment-option">
                        <input type="radio" name="payment-method" value="card" onchange="togglePaymentFields('card')">

                        <span>
                            <i class="fa-solid fa-credit-card card-icon"></i>

                            <span>
                                <strong>Cartão</strong>
                                <small>Crédito ou débito na entrega</small>
                            </span>
                        </span>
                    </label>

                    <!-- DINHEIRO -->
                    <label class="payment-option">
                        <input type="radio" name="payment-method" value="cash" onchange="togglePaymentFields('cash')">

                        <span>
                            <i class="fa-solid fa-money-bill-wave cash-icon"></i>

                            <span>
                                <strong>Dinheiro na entrega</strong>
                                <small>Pague ao receber seu pedido</small>
                            </span>
                        </span>
                    </label>

                </div>

                <!-- CAMPOS EXTRAS DO PAGAMENTO -->
                <div id="payment-extra-fields" class="payment-extra-fields"></div>

                <button type="button" class="finalize-button" onclick="finalizeOrder()">
                    <i class="fa-solid fa-check"></i>
                    Finalizar Pedido
                </button>

            </section>

            <!-- RESUMO DO PEDIDO -->
            <aside class="cart-summary">

                <h2>
                    <i class="fa-solid fa-receipt"></i>
                    Resumo do Pedido
                </h2>

                <div class="cart-items"></div>

                <div class="cart-totals">
                    <div class="total-row grand-total">
                        <span>Total</span>
                        <span class="order-total">R$ 0,00</span>
                    </div>

                </div>

            </aside>

            <!-- PEDIDO FINALIZADO -->
            <section id="step-success" class="success-card hidden">

                <div class="success-icon">
                    <i class="fa-solid fa-check"></i>
                </div>

                <h2>Pedido Realizado com Sucesso!</h2>

                <p>
                    Obrigado pela preferência!
                    Seu pedido foi finalizado.
                </p>

                <div class="success-actions">
                    <button type="button" class="new-order-button" onclick="newOrder()">
                        Fazer Novo Pedido
                    </button>
                </div>

            </section>

        </div>
    </main>

    <!-- RODAPÉ -->
    <footer>
        <p>© 2026 Cardápio digital. Todos os direitos reservados.</p>
    </footer>

    <script>
        // Exibe os campos de acordo com a forma de pagamento escolhida.
        function togglePaymentFields(method) {
            const extraFields = document.getElementById(
                "payment-extra-fields"
            );

            if (method === "pix") {
                extraFields.innerHTML = `
                    <div class="payment-info">
                        <i class="fa-brands fa-pix"></i>
                        <div>
                            <strong>Pagamento via PIX</strong>
                            <p>
                                As instruções para pagamento via PIX
                                serão informadas pelo estabelecimento.
                            </p>
                        </div>
                    </div>
                `;
            } else if (method === "card") {
                extraFields.innerHTML = `
                    <div class="payment-info">
                        <i class="fa-solid fa-credit-card"></i>
                        <div>
                            <strong>Pagamento com cartão</strong>
                            <p>
                                Você poderá pagar com cartão de crédito
                                ou débito no momento da entrega.
                            </p>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="card-type">Tipo de cartão</label>
                        <select id="card-type" name="card-type">
                            <option value="">Selecione</option>
                            <option value="credito">Crédito</option>
                            <option value="debito">Débito</option>
                        </select>
                    </div>
                `;
            } else if (method === "cash") {
                extraFields.innerHTML = `
                    <div class="payment-info">
                        <i class="fa-solid fa-money-bill-wave"></i>
                        <div>
                            <strong>Pagamento em dinheiro</strong>
                            <p>
                                Informe se precisará de troco.
                            </p>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="change-needed">
                            Precisa de troco?
                        </label>

                        <select
                            id="change-needed"
                            name="change-needed"
                            onchange="toggleChangeField()"
                        >
                            <option value="nao">Não</option>
                            <option value="sim">Sim</option>
                        </select>
                    </div>

                    <div id="change-field"></div>
                `;
            }
        }

        // Exibe o campo para informar o valor do troco.
        function toggleChangeField() {
            const changeNeeded = document.getElementById("change-needed");
            const changeField = document.getElementById("change-field");

            if (changeNeeded.value === "sim") {
                changeField.innerHTML = `
                    <div class="form-group">
                        <label for="change-amount">
                            Troco para quanto?
                        </label>

                        <input
                            type="number"
                            id="change-amount"
                            name="change-amount"
                            min="0"
                            step="0.01"
                            placeholder="Ex.: 100,00"
                        >
                    </div>
                `;
            } else {
                changeField.innerHTML = "";
            }
        }

        // Finaliza a demonstração do pedido.
        function finalizeOrder() {
            const cart = JSON.parse(localStorage.getItem("loveJunckCart") || "[]");

            if (!Array.isArray(cart) || cart.length === 0) {
                alert("Seu carrinho está vazio. Volte ao cardápio e adicione produtos.");
                return;
            }

            const selectedPayment = document.querySelector(
                'input[name="payment-method"]:checked'
            );

            if (!selectedPayment) {
                alert("Selecione uma forma de pagamento.");
                return;
            }

            if (selectedPayment.value === "card") {
                const cardType = document.getElementById("card-type");

                if (!cardType || !cardType.value) {
                    alert("Selecione crédito ou débito.");
                    return;
                }
            }

            if (selectedPayment.value === "cash") {
                const changeNeeded = document.getElementById("change-needed");

                if (changeNeeded.value === "sim") {
                    const changeAmount = document.getElementById("change-amount");

                    if (
                        !changeAmount ||
                        !changeAmount.value ||
                        Number(changeAmount.value) <= 0
                    ) {
                        alert("Informe um valor válido para o troco.");
                        return;
                    }
                }
            }

            if (typeof enviarPedidoWhatsApp === "function") {
                const enviado = enviarPedidoWhatsApp(selectedPayment.value);
                if (!enviado) return;
            }

            document.getElementById("step-2-content").classList.add("hidden");
            document.querySelector(".cart-summary").classList.add("hidden");
            document.getElementById("step-success").classList.remove("hidden");
        }

        // Retorno provisório: ajuste para a etapa de endereço do seu projeto.
        function backToAddress() {
            const addressStep = document.getElementById("step-1-content");

            if (addressStep) {
                document.getElementById("step-2-content").classList.add("hidden");
                addressStep.classList.remove("hidden");
            } else {
                alert("A etapa de endereço precisa estar conectada nesta página.");
            }
        }

        // Reinicia a demonstração.
        function newOrder() {
            window.location.reload();
        }
    </script>


    <script src="../scripts/pagamento.js"></script>
    <script src="../scripts/dark-mode.js"></script>
</body>

</html>
