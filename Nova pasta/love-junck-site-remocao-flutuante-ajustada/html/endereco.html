<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/endereco.css">
    <link rel="stylesheet" href="../css/dark-mode.css">
    <title>Checkout - Pagamento</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="bg-gray-100 min-h-screen flex flex-col justify-between font-sans">


    <header class="bg-red-600 text-white shadow-md py-4 px-6">


        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">

            <!-- Formulário Principal (Etapas) -->
            <div class="md:col-span-2 bg-white rounded-xl shadow-md p-6">

                <!-- ETAPA 1: Endereço e Dados -->
                <div id="step-1-content" class="space-y-4">
                    <h2 class="text-lg font-bold text-gray-800 border-b pb-2"><i
                            class="fa-solid fa-location-dot text-red-600"></i> Endereço de Entrega</h2>

                    <form id="form-address" class="space-y-4">
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">CEP</label>
                                <input type="text" id="cep" placeholder="00000-000" required
                                    class="w-full border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-red-500">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Número</label>
                                <input type="text" id="numero" placeholder="Ex: 123" required
                                    class="w-full border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-red-500">
                            </div>
                        </div>

                        <div>
                            <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Endereço
                                (Rua/Avenida)</label>
                            <input type="text" id="rua" placeholder="Ex: Rua das Flores" required
                                class="w-full border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-red-500">
                        </div>

                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Bairro</label>
                                <input type="text" id="bairro" placeholder="Ex: Centro" required
                                    class="w-full border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-red-500">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Complemento
                                    (Opcional)</label>
                                <input type="text" id="complemento" placeholder="Ex: Apto 402"
                                    class="w-full border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-red-500">
                            </div>
                        </div>

                        <div>
                            <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Telefone para
                                Contato</label>
                            <input type="tel" id="telefone" placeholder="(00) 00000-0000" required
                                class="w-full border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-red-500">
                        </div>

                        <button type="button" onclick="goToPayment()"
                            class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 rounded-lg transition-colors mt-4">
                            Ir para Pagamento <i class="fa-solid fa-arrow-right ml-2"></i>
                        </button>
                    </form>
                </div>




                <script src="../scripts/endereco.js"></script>
                <script src="../scripts/dark-mode.js"></script>
</body>

</html>
